<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VaultCore — A production-grade banking transaction system with double-entry ledger accounting, ACID transactions, and real-time notifications.">
    <meta name="theme-color" content="#060a13">
    <title>VaultCore — Banking Infrastructure</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛</text></svg>">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Animated background mesh -->
    <div class="bg-mesh"></div>

    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar" id="app-nav"></nav>

        <!-- Toast Container -->
        <div class="toast-container" id="toast-container"></div>

        <!-- Main Content -->
        <main class="main-content" id="app-content">
            <!-- Loading state -->
            <div class="loading-container">
                <div class="spinner spinner--lg spinner--cyan"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer style="text-align:center;padding:24px;color:var(--text-muted);font-size:0.75rem;border-top:1px solid var(--border-color)">
            <p>VaultCore · Double-Entry Ledger Banking System</p>
            <p style="margin-top:4px">Built with Node.js, Express, MongoDB · ACID Transactions · JWT Auth</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
